# vim: et
---

- name: Create the cronjob log directory for {{ item }}
  ansible.builtin.file:
    path: "/home/{{ item }}/logs"
    state: directory
    mode: '0750'

- name: Cron job - Update LGSM {{ item }}
  ansible.builtin.cron:
    name: Update LGSM
    minute: '00'
    hour: '3'
    day: '6'
    job: '/home/{{ item }}/{{ item }} update-lgsm > /home/{{ item }}/logs/update-lgsm.log'

- name: Cron job - Update Server {{ item }}
  ansible.builtin.cron:
    name: Update {{ item }}
    minute: '*/30'
    job: '/home/{{ item }}/{{ item }} update > /home/{{ item }}/logs/update.log'

- name: Cron job - Monitor Server {{ item }}
  ansible.builtin.cron:
    name: Monitor {{ item }}
    minute: '*/5'
    job: '/home/{{ item }}/{{ item }} monitor > /home/{{ item }}/logs/monitor.log'
