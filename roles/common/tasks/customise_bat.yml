# vim: et
---

- name: Create bat config directory
  ansible.builtin.file:
    dest: '{{ lookup("env", "HOME") }}/.config/bat'
    state: directory
    mode: '0755'
    owner: "{{ main_username }}"
    group: "{{ main_username }}"

- name: Copy the bat config file
  ansible.builtin.copy:
    src: bat_config
    dest: '{{ lookup("env", "HOME") }}/.config/bat/config'
    mode: '0644'
    owner: "{{ main_username }}"
    group: "{{ main_username }}"
