# vim: et
---

- name: Distro-specific steps to setup docker repo
  ansible.builtin.include_tasks: "repo_setup/{{ ansible_facts['os_family'] }}.yml"

- name: Distro-specific steps to install docker packages
  ansible.builtin.include_tasks: "install_packages/{{ ansible_facts['os_family'] }}.yml"

- name: Enable the docker service
  ansible.builtin.include_tasks: enable_docker.yml

- name: Create shell completion files
  ansible.builtin.include_tasks: create_shell_completions.yml
